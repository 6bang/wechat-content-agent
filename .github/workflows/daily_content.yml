name: Daily WeChat Content Agent

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        required: true
        default: "publish"
        type: choice
        options:
          - topics
          - editor
          - outline
          - draft
          - review
          - publish
          - all
      run_date:
        description: "Run date in YYYY-MM-DD. Defaults to Beijing today."
        required: false
        type: string
  schedule:
    - cron: "0 22 * * *" # 06:00 Beijing, topics
    - cron: "0 0 * * *"  # 08:00 Beijing, editor
    - cron: "0 1 * * *"  # 09:00 Beijing, outline
    - cron: "0 2 * * *"  # 10:00 Beijing, draft
    - cron: "0 3 * * *"  # 11:00 Beijing, review
    - cron: "0 4 * * *"  # 12:00 Beijing, publish

jobs:
  run-content-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      MODEL: ${{ vars.MODEL }}
      USE_MOCK: ${{ vars.USE_MOCK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve stage and Beijing date
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGE="${{ inputs.stage }}"
            RUN_DATE="${{ inputs.run_date }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") STAGE="topics" ;;
              "0 0 * * *") STAGE="editor" ;;
              "0 1 * * *") STAGE="outline" ;;
              "0 2 * * *") STAGE="draft" ;;
              "0 3 * * *") STAGE="review" ;;
              "0 4 * * *") STAGE="publish" ;;
              *) STAGE="publish" ;;
            esac
            RUN_DATE=""
          fi

          if [[ -z "$RUN_DATE" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Run daily content pipeline
        env:
          ENABLE_FEISHU: ${{ secrets.ENABLE_FEISHU }}
          ENABLE_FEISHU_STAGE_REPORT: ${{ secrets.ENABLE_FEISHU_STAGE_REPORT }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          export USE_MOCK="${USE_MOCK:-true}"
          export OPENAI_MODEL="${OPENAI_MODEL:-${MODEL:-gpt-4.1-mini}}"
          python src/main.py --stage "${{ steps.resolve.outputs.stage }}" --date "${{ steps.resolve.outputs.run_date }}"

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: wechat-content-${{ steps.resolve.outputs.run_date }}-${{ steps.resolve.outputs.stage }}
          path: outputs/${{ steps.resolve.outputs.run_date }}/
          if-no-files-found: error
