name: Daily WeChat Content Agent

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date in YYYY-MM-DD. Defaults to Beijing today."
        required: false
        type: string
      action:
        description: "Remote action to run."
        required: false
        default: "daily_pipeline"
        type: choice
        options:
          - daily_pipeline
          - sync_wechat_draft
      stage:
        description: "Pipeline stage. Use all for the full workflow."
        required: false
        default: "all"
        type: choice
        options:
          - topics
          - editor
          - outline
          - draft
          - review
          - publish
          - visual
          - all
      layer:
        description: "Article layer used when action is sync_wechat_draft."
        required: false
        default: "C"
        type: choice
        options:
          - C
          - E
          - S
  schedule:
    - cron: "0 17 * * *" # 01:00 Beijing

jobs:
  run-content-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      USE_MOCK: ${{ secrets.USE_MOCK }}
      MODEL: ${{ secrets.MODEL }}
      ENABLE_FEISHU: ${{ secrets.ENABLE_FEISHU }}
      ENABLE_FEISHU_STAGE_REPORT: ${{ secrets.ENABLE_FEISHU_STAGE_REPORT }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_TOPIC_WEBHOOK_URL: ${{ secrets.FEISHU_TOPIC_WEBHOOK_URL }}
      FEISHU_EDITOR_WEBHOOK_URL: ${{ secrets.FEISHU_EDITOR_WEBHOOK_URL }}
      FEISHU_WRITER_WEBHOOK_URL: ${{ secrets.FEISHU_WRITER_WEBHOOK_URL }}
      FEISHU_REVIEWER_WEBHOOK_URL: ${{ secrets.FEISHU_REVIEWER_WEBHOOK_URL }}
      FEISHU_PUBLISHER_WEBHOOK_URL: ${{ secrets.FEISHU_PUBLISHER_WEBHOOK_URL }}
      FEISHU_VISUAL_WEBHOOK_URL: ${{ secrets.FEISHU_VISUAL_WEBHOOK_URL }}
      FEISHU_CONTROLLER_WEBHOOK_URL: ${{ secrets.FEISHU_CONTROLLER_WEBHOOK_URL }}
      ENABLE_FEISHU_DOC: ${{ secrets.ENABLE_FEISHU_DOC }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DOC_FOLDER_TOKEN: ${{ secrets.FEISHU_DOC_FOLDER_TOKEN }}
      FEISHU_DOC_BASE_URL: ${{ secrets.FEISHU_DOC_BASE_URL }}
      ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ENABLE_COURSEWARE_CONTEXT: ${{ secrets.ENABLE_COURSEWARE_CONTEXT }}
      COURSEWARE_REPO_TOKEN: ${{ secrets.COURSEWARE_REPO_TOKEN }}
      COURSEWARE_PATH: courseware/6bang-courseware
      COURSEWARE_REFERENCE_PATHS: ${{ secrets.COURSEWARE_REFERENCE_PATHS }}
      COURSEWARE_MAX_FILES: ${{ secrets.COURSEWARE_MAX_FILES }}
      ENABLE_WECHAT_DRAFT: ${{ secrets.ENABLE_WECHAT_DRAFT }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      WECHAT_AUTHOR: ${{ secrets.WECHAT_AUTHOR }}
      WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
      WECHAT_COVER_IMAGE_PATH: ${{ secrets.WECHAT_COVER_IMAGE_PATH }}
      WECHAT_CONTENT_SOURCE_URL: ${{ secrets.WECHAT_CONTENT_SOURCE_URL }}
      ENABLE_WECOM_NOTIFY: ${{ secrets.ENABLE_WECOM_NOTIFY }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out courseware repository
        if: ${{ env.ENABLE_COURSEWARE_CONTEXT == 'true' && env.COURSEWARE_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: 6bang/6bang-courseware
          token: ${{ secrets.COURSEWARE_REPO_TOKEN }}
          path: courseware/6bang-courseware
          lfs: true
          sparse-checkout: |
            README.md
            01_课程总纲
            02_线下课课件
            05_客户案例
            06_销售素材
            07_公众号素材

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve Beijing date
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="${{ inputs.run_date }}"
          ACTION="${{ inputs.action }}"
          STAGE="${{ inputs.stage }}"
          LAYER="${{ inputs.layer }}"
          if [[ -z "$RUN_DATE" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          if [[ -z "$ACTION" ]]; then
            ACTION="daily_pipeline"
          fi
          if [[ -z "$STAGE" ]]; then
            STAGE="all"
          fi
          if [[ -z "$LAYER" ]]; then
            LAYER="C"
          fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "layer=$LAYER" >> "$GITHUB_OUTPUT"

      - name: Run daily content pipeline
        shell: bash
        run: |
          set -euo pipefail
          export USE_MOCK="${USE_MOCK:-true}"
          export MODEL="${MODEL:-gpt-5.5-thinking}"
          export ENABLE_COURSEWARE_CONTEXT="${ENABLE_COURSEWARE_CONTEXT:-false}"
          export COURSEWARE_MAX_FILES="${COURSEWARE_MAX_FILES:-12}"
          case "${{ steps.resolve.outputs.action }}" in
            daily_pipeline)
              python src/main.py --date "${{ steps.resolve.outputs.run_date }}" --stage "${{ steps.resolve.outputs.stage }}"
              ;;
            sync_wechat_draft)
              python src/main.py --date "${{ steps.resolve.outputs.run_date }}"
              python src/sync_wechat_draft.py --date "${{ steps.resolve.outputs.run_date }}" --layer "${{ steps.resolve.outputs.layer }}"
              ;;
            *)
              echo "Unknown action: ${{ steps.resolve.outputs.action }}"
              exit 1
              ;;
          esac

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: wechat-content-${{ steps.resolve.outputs.run_date }}
          path: outputs/${{ steps.resolve.outputs.run_date }}/
          if-no-files-found: error
