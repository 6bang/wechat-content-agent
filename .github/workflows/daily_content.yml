name: Daily WeChat Content Agent

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date in YYYY-MM-DD. Defaults to Beijing today."
        required: false
        type: string
  schedule:
    - cron: "0 17 * * *" # 01:00 Beijing

jobs:
  run-content-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      USE_MOCK: ${{ secrets.USE_MOCK }}
      MODEL: ${{ secrets.MODEL }}
      ENABLE_FEISHU: ${{ secrets.ENABLE_FEISHU }}
      ENABLE_FEISHU_STAGE_REPORT: ${{ secrets.ENABLE_FEISHU_STAGE_REPORT }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_TOPIC_WEBHOOK_URL: ${{ secrets.FEISHU_TOPIC_WEBHOOK_URL }}
      FEISHU_EDITOR_WEBHOOK_URL: ${{ secrets.FEISHU_EDITOR_WEBHOOK_URL }}
      FEISHU_WRITER_WEBHOOK_URL: ${{ secrets.FEISHU_WRITER_WEBHOOK_URL }}
      FEISHU_REVIEWER_WEBHOOK_URL: ${{ secrets.FEISHU_REVIEWER_WEBHOOK_URL }}
      FEISHU_PUBLISHER_WEBHOOK_URL: ${{ secrets.FEISHU_PUBLISHER_WEBHOOK_URL }}
      FEISHU_VISUAL_WEBHOOK_URL: ${{ secrets.FEISHU_VISUAL_WEBHOOK_URL }}
      FEISHU_CONTROLLER_WEBHOOK_URL: ${{ secrets.FEISHU_CONTROLLER_WEBHOOK_URL }}
      ENABLE_FEISHU_DOC: ${{ secrets.ENABLE_FEISHU_DOC }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DOC_FOLDER_TOKEN: ${{ secrets.FEISHU_DOC_FOLDER_TOKEN }}
      FEISHU_DOC_BASE_URL: ${{ secrets.FEISHU_DOC_BASE_URL }}
      ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve Beijing date
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="${{ inputs.run_date }}"
          if [[ -z "$RUN_DATE" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Run daily content pipeline
        shell: bash
        run: |
          set -euo pipefail
          export USE_MOCK="${USE_MOCK:-true}"
          export MODEL="${MODEL:-gpt-5.5-thinking}"
          python src/main.py --date "${{ steps.resolve.outputs.run_date }}"

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: wechat-content-${{ steps.resolve.outputs.run_date }}
          path: outputs/${{ steps.resolve.outputs.run_date }}/
          if-no-files-found: error
