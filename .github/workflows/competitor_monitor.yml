name: Competitor WeChat Monitor

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date in YYYY-MM-DD. Defaults to Beijing today."
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *" # 10:00 Beijing

jobs:
  monitor-competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENABLE_FEISHU: ${{ secrets.ENABLE_FEISHU }}
      ENABLE_COMPETITOR_MONITOR_FEISHU: ${{ secrets.ENABLE_COMPETITOR_MONITOR_FEISHU }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_CONTROLLER_WEBHOOK_URL: ${{ secrets.FEISHU_CONTROLLER_WEBHOOK_URL }}
      COMPETITOR_MONITOR_PROVIDER: ${{ secrets.COMPETITOR_MONITOR_PROVIDER }}
      JUSTONE_API_KEY: ${{ secrets.JUSTONE_API_KEY }}
      JUSTONE_API_BASE: ${{ secrets.JUSTONE_API_BASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve Beijing date
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="${{ inputs.run_date }}"
          if [[ -z "$RUN_DATE" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Run competitor monitor
        shell: bash
        run: |
          set -euo pipefail
          python src/monitor_competitors.py --date "${{ steps.resolve.outputs.run_date }}"

      - name: Upload competitor monitor report
        uses: actions/upload-artifact@v4
        with:
          name: competitor-monitor-${{ steps.resolve.outputs.run_date }}
          path: outputs/competitor_monitor/${{ steps.resolve.outputs.run_date }}/
          if-no-files-found: error
